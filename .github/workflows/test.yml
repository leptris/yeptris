name: C Library & CLI Test Suite

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-library:
    name: Test C Library on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DBUILD_TESTING=ON \
            -DYEPTRIS_BUILD_CLI=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DYEPTRIS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke
        run: ./build/cli/yeptris version
