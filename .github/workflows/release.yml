name: Release

# TODO.impl/20: releases are the automated workflow's job, never a
# manual tag. Phase 1 (workflow_dispatch with next_version) bumps the
# version (CMakeLists project VERSION is the SSOT; vcpkg.json +
# CHANGELOG sync) and opens the release PR. Phase 2 fires when that
# PR merges: tag + GitHub Release. The exact version number always
# comes from the dispatching human.

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: "Exact version to release (e.g. 0.2.0); omit when republishing"
        required: false
        type: string
      republish_version:
        description: "Re-publish an already-tagged version (gem + native asset); skips the cut"
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  id-token: write # RubyGems trusted publisher (OIDC)

jobs:
  cut:
    if: github.event_name == 'workflow_dispatch' && inputs.next_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version shape
        run: |
          echo "${{ inputs.next_version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not X.Y.Z"; exit 1; }

      - name: "Changelog gate: [Unreleased] must exist"
        run: |
          # the bump renames this header; without it the rename no-ops
          # and the release ships undocumented (ten did — item 17)
          grep -q '^## \[Unreleased\]' CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [Unreleased]' section." >&2
            echo "Add one before releasing, or this release ships undocumented." >&2
            exit 1
          }

      - name: "Bump version (CMakeLists project VERSION is the SSOT)"
        run: |
          V="${{ inputs.next_version }}"
          sed -i "s/    VERSION [0-9]*\.[0-9]*\.[0-9]*/    VERSION $V/" CMakeLists.txt
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$V\"/" vcpkg.json
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$V\"/" ports/yeptris/vcpkg.json
          TODAY=$(date +%Y-%m-%d)
          if [ -f CHANGELOG.md ]; then
            sed -i "0,/^## \[Unreleased\]/s//## \[$V\] - $TODAY/" CHANGELOG.md
          fi

      - name: Create release PR
        run: |
          V="${{ inputs.next_version }}"
          git config user.name "release-workflow"
          git config user.email "release@yeptris.invalid"
          git checkout -b "release/v$V"
          git add CMakeLists.txt vcpkg.json ports/yeptris/vcpkg.json CHANGELOG.md 2>/dev/null || git add CMakeLists.txt vcpkg.json ports/yeptris/vcpkg.json
          git commit -m "release: v$V"
          git push origin "release/v$V"
          gh pr create --title "release: v$V" --body "Automated release branch for v$V. On merge, the workflow tags and publishes the GitHub Release." --base main
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.republish_version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tag and publish the GitHub Release
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $V"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$V" >/dev/null; then
            echo "tag v$V exists (republish mode): skipping tag/create"
            gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "v$V" --generate-notes
            SKIP_TAG=1
          else
            git config user.name "release-workflow"
            git config user.email "release@yeptris.invalid"
            git tag "v$V"
            git push origin "v$V"
            gh release create "v$V" --title "v$V" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # TODO.restructure/28: prebuilt native materializer for this
      # runner's platform, attached to the release. The recipe lives
      # in a versioned script (scripts/build-native-asset.sh) — kept
      # out of the workflow, reviewed like any other code.
      - name: Install build tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build >/dev/null
      - name: Build and attach the native asset
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          scripts/build-native-asset.sh "$V" https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/native-asset"
          gh release upload "v$V" "$RUNNER_TEMP/native-asset"/yeptris-native-*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # The lockstep gem: publish the yeptris-ruby tag matching this C
      # version ({c-full-semver}.{small-patch}) through the RubyGems
      # trusted publisher configured for THIS repo + workflow. No
      # matching tag (or the version already on RubyGems) -> skip.
      - name: Find the lockstep gem tag
        id: gemtag
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          git clone --quiet https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/yeptris-ruby"
          cd "$RUNNER_TEMP/yeptris-ruby"
          BEST="$(git tag | grep -E "^v${V//./\.}\.[0-9]+$" | sort -V | tail -1 || true)"
          if [ -z "$BEST" ]; then
            echo "no lockstep gem tag v${V}.* — skipping gem publish"
            echo "found=" >> "$GITHUB_OUTPUT"
          else
            # idempotence: the RubyGems versions API is authoritative
            # (gem fetch --version exits 0 spuriously for missing
            # versions on the runners); repushing is forbidden forever
            gem_version="${BEST#v}"
            if curl -sf https://rubygems.org/api/v1/versions/yeptris.json \
                | grep -q "\"number\":\"$gem_version\""; then
              echo "yeptris $gem_version already on RubyGems — skipping push"
              echo "found=" >> "$GITHUB_OUTPUT"
            else
              echo "lockstep gem: $BEST"
              echo "found=$BEST" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Ruby
        if: steps.gemtag.outputs.found != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build the gem
        if: steps.gemtag.outputs.found != ''
        working-directory: ${{ runner.temp }}/yeptris-ruby
        run: |
          git checkout --quiet "${{ steps.gemtag.outputs.found }}"
          gem build yeptris.gemspec
          GEM_FILE="$(ls yeptris-*.gem | head -1)"
          echo "path=${RUNNER_TEMP}/yeptris-ruby/${GEM_FILE}" >> "$GITHUB_OUTPUT"
        id: gembuild

      # The exchange is rubygems' own action (the same one release-gem
      # composes): it mints a scoped API key from this job's OIDC token
      # and exports GEM_HOST_API_KEY — the hand-rolled curl hit the
      # wrong endpoint shape ("HTTP Basic: Access denied" on
      # /api/v1/api_key; the OIDC probe workflow proved the token
      # itself fine).
      - name: Configure RubyGems credentials (trusted publisher)
        if: steps.gemtag.outputs.found != ''
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push to RubyGems
        if: steps.gemtag.outputs.found != ''
        run: gem push "${{ steps.gembuild.outputs.path }}"

  # TODO.restructure/28's remainder: PLATFORM GEMS — the ruby gem +
  # vendored libyeptris + the compiled native materializer with a
  # RELATIVE rpath ($ORIGIN/@loader_path), so `gem install yeptris`
  # beats JSON.parse with zero compilation and zero env vars. The
  # recipe lives in the ruby repo's scripts/build-platform-gem.sh.
  platform-gems:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.republish_version != '')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build >/dev/null

      - name: Install build tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build the platform gem
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          git clone --quiet https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/rubyrepo"
          bash "$RUNNER_TEMP/rubyrepo/scripts/build-platform-gem.sh" "$V" https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/pgem"

      - name: Configure RubyGems credentials (trusted publisher)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push the platform gem
        run: |
          GEM="$(cat "$RUNNER_TEMP/pgem/gempath" | cut -d= -f2)"
          if gem fetch yeptris --platform "$(ruby -e 'print Gem::Platform.local.to_s')" --version "$(basename "$GEM" | sed -E 's/^yeptris-([0-9.]+)-.*/\1/')" >/dev/null 2>&1; then
            echo "already pushed; skipping"
          else
            gem push "$GEM"
          fi
