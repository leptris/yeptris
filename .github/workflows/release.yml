name: Release

# TODO.impl/20: releases are the automated workflow's job, never a
# manual tag. Phase 1 (workflow_dispatch with next_version) bumps the
# version (CMakeLists project VERSION is the SSOT; vcpkg.json +
# CHANGELOG sync) and opens the release PR. Phase 2 fires when that
# PR merges: tag + GitHub Release. The exact version number always
# comes from the dispatching human.

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: "Exact version to release (e.g. 0.2.0); omit when republishing"
        required: false
        type: string
      republish_version:
        description: "Re-publish an already-tagged version (gem + native asset); skips the cut"
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  id-token: write # RubyGems trusted publisher (OIDC)

jobs:
  cut:
    if: github.event_name == 'workflow_dispatch' && inputs.next_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version shape
        run: |
          echo "${{ inputs.next_version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not X.Y.Z"; exit 1; }

      - name: "Changelog gate: [Unreleased] must exist"
        run: |
          # the bump renames this header; without it the rename no-ops
          # and the release ships undocumented (ten did — item 17)
          grep -q '^## \[Unreleased\]' CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [Unreleased]' section." >&2
            echo "Add one before releasing, or this release ships undocumented." >&2
            exit 1
          }

      - name: "Bump version (CMakeLists project VERSION is the SSOT)"
        run: |
          V="${{ inputs.next_version }}"
          sed -i "s/    VERSION [0-9]*\.[0-9]*\.[0-9]*/    VERSION $V/" CMakeLists.txt
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$V\"/" vcpkg.json
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$V\"/" ports/yeptris/vcpkg.json
          TODAY=$(date +%Y-%m-%d)
          if [ -f CHANGELOG.md ]; then
            sed -i "0,/^## \[Unreleased\]/s//## \[$V\] - $TODAY/" CHANGELOG.md
          fi

      - name: Create release PR
        run: |
          V="${{ inputs.next_version }}"
          git config user.name "release-workflow"
          git config user.email "release@yeptris.invalid"
          git checkout -b "release/v$V"
          git add CMakeLists.txt vcpkg.json ports/yeptris/vcpkg.json CHANGELOG.md 2>/dev/null || git add CMakeLists.txt vcpkg.json ports/yeptris/vcpkg.json
          git commit -m "release: v$V"
          git push origin "release/v$V"
          gh pr create --title "release: v$V" --body "Automated release branch for v$V. On merge, the workflow tags and publishes the GitHub Release." --base main
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.republish_version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tag and publish the GitHub Release
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $V"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$V" >/dev/null; then
            echo "tag v$V exists (republish mode): skipping tag/create"
            gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "v$V" --generate-notes
            SKIP_TAG=1
          else
            git config user.name "release-workflow"
            git config user.email "release@yeptris.invalid"
            git tag "v$V"
            git push origin "v$V"
            gh release create "v$V" --title "v$V" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # TODO.restructure/28: prebuilt native materializer for this
      # runner's platform, attached to the release. The recipe lives
      # in a versioned script (scripts/build-native-asset.sh) — kept
      # out of the workflow, reviewed like any other code.
      - name: Install build tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build >/dev/null
      - name: Build and attach the native asset
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          scripts/build-native-asset.sh "$V" https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/native-asset"
          gh release upload "v$V" "$RUNNER_TEMP/native-asset"/yeptris-native-*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # The lockstep gem: publish the yeptris-ruby tag matching this C
      # version ({c-full-semver}.{small-patch}) through the RubyGems
      # trusted publisher configured for THIS repo + workflow. No
      # matching tag (or the version already on RubyGems) -> skip.
      - name: Find the lockstep gem tag
        id: gemtag
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          git clone --quiet https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/yeptris-ruby"
          cd "$RUNNER_TEMP/yeptris-ruby"
          BEST="$(git tag | grep -E "^v${V//./\.}\.[0-9]+$" | sort -V | tail -1 || true)"
          if [ -z "$BEST" ]; then
            echo "no lockstep gem tag v${V}.* — skipping gem publish"
            echo "found=" >> "$GITHUB_OUTPUT"
          else
            # idempotence: the RubyGems versions API is authoritative
            # (gem fetch --version exits 0 spuriously for missing
            # versions on the runners); repushing is forbidden forever
            gem_version="${BEST#v}"
            # platform gems share the NUMBER - match number+platform
            if curl -sf https://rubygems.org/api/v1/versions/yeptris.json | \
                ruby -rjson -e 'exit(JSON.parse(STDIN.read).any? { |v| v["number"]==ARGV[0] && v["platform"]=="ruby" } ? 0 : 1)' "$gem_version"; then
              echo "yeptris $gem_version already on RubyGems — skipping push"
              echo "found=" >> "$GITHUB_OUTPUT"
            else
              echo "lockstep gem: $BEST"
              echo "found=$BEST" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Ruby
        if: steps.gemtag.outputs.found != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build the gem
        if: steps.gemtag.outputs.found != ''
        working-directory: ${{ runner.temp }}/yeptris-ruby
        run: |
          git checkout --quiet "${{ steps.gemtag.outputs.found }}"
          # libyeptris rides the pure gem too: vendor the C sources
          # (the checkout at top is this release's C ref; deps/ is a
          # 40MB corpus the no-testing build never touches) — the
          # gem's extension builds them at install time
          mkdir -p vendor/libyeptris
          cp -R "$GITHUB_WORKSPACE/CMakeLists.txt" \
                "$GITHUB_WORKSPACE/cmake" \
                "$GITHUB_WORKSPACE/src" vendor/libyeptris/
          gem build yeptris.gemspec
          GEM_FILE="$(ls yeptris-*.gem | head -1)"
          echo "path=${RUNNER_TEMP}/yeptris-ruby/${GEM_FILE}" >> "$GITHUB_OUTPUT"
        id: gembuild

      # TODO.restructure/40: the ruby-platform gem has no vendored lib
      # — smoke it against a shared lib built from THIS release's
      # tree (the checkout at the top is the release ref).
      - name: Build the C shared library (smoke fixture)
        if: steps.gemtag.outputs.found != ''
        run: cmake -S . -B "$RUNNER_TEMP/cbuild" -G Ninja -DCMAKE_BUILD_TYPE=Release -DYEPTRIS_BUILD_SHARED=ON -DYEPTRIS_BUILD_CLI=OFF -DBUILD_TESTING=OFF && cmake --build "$RUNNER_TEMP/cbuild" --target yeptris_shared

      - name: Smoke the gem
        if: steps.gemtag.outputs.found != ''
        run: YEPTRIS_LIB_PATH="$RUNNER_TEMP/cbuild/src/libyeptris.so" scripts/smoke-gem.sh "${{ steps.gembuild.outputs.path }}" "$RUNNER_TEMP/yeptris-ruby"

      # The exchange is rubygems' own action (the same one release-gem
      # composes): it mints a scoped API key from this job's OIDC token
      # and exports GEM_HOST_API_KEY — the hand-rolled curl hit the
      # wrong endpoint shape ("HTTP Basic: Access denied" on
      # /api/v1/api_key; the OIDC probe workflow proved the token
      # itself fine).
      - name: Configure RubyGems credentials (trusted publisher)
        if: steps.gemtag.outputs.found != ''
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push to RubyGems
        if: steps.gemtag.outputs.found != ''
        run: gem push "${{ steps.gembuild.outputs.path }}"

  # The musl platform gems (issue #316: full-platform coverage —
  # Alpine/edge users resolve x86_64-linux-musl / aarch64-linux-musl).
  # JS actions cannot run inside Alpine, so the whole leg — clone,
  # build, smoke, and the already-pushed check — rides docker run
  # with the workspace mounted; the platform string comes from the
  # BUILT GEM's filename (the host's local platform is glibc).
  platform-gems-musl:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.republish_version != '')
    runs-on: ${{ matrix.os }}
    needs: publish
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
    steps:
      - name: Resolve the release version
        shell: bash
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          echo "YEP_V=$V" >> "$GITHUB_ENV"

      - name: Build the musl platform gem (Alpine container)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pgem"
          docker run --rm -v "$RUNNER_TEMP:/work" -w /work -e V="$YEP_V" ruby:3.4-alpine sh -c '
            set -eux
            apk add --no-cache build-base bash git cmake ninja
            git clone --quiet https://github.com/leptris/yeptris-ruby /work/rubyrepo
            bash /work/rubyrepo/scripts/build-platform-gem.sh "$V" https://github.com/leptris/yeptris-ruby /work/pgem
          '

      - name: Smoke the musl platform gem (Alpine container)
        shell: bash
        run: |
          ls -la "$RUNNER_TEMP/pgem/yeptris-ruby/" | head -8 || true
          GEM="$(find "$RUNNER_TEMP/pgem" -name 'yeptris-*-linux-musl.gem' | head -1)"
          test -n "$GEM" || { echo "no musl gem this run"; exit 0; }
          echo "gem: $GEM"
          # the smoke runs inside the container, where RUNNER_TEMP is
          # the /work mount — the host path does not exist there
          GEM_CTR="/work${GEM#$RUNNER_TEMP}"
          docker run --rm -v "$RUNNER_TEMP:/work" -w /work ruby:3.4-alpine sh -c '
            set -eux
            gem install ffi --no-document  # --local below cannot resolve deps remotely
            gem install --local --no-document "'"$GEM_CTR"'"
            ruby -e "require %(yeptris); abort %(smoke) unless Yeptris::YAML.load(%(a: [1, 2])) == { %(a) => [1, 2] }; puts %(SMOKE PASS yeptris musl)"
          '

      - name: Configure RubyGems credentials (trusted publisher)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push the musl platform gem
        shell: bash
        run: |
          GEM="$(cat "$RUNNER_TEMP/pgem/gempath" 2>/dev/null | cut -d= -f2 || true)"
          test -n "$GEM" || { echo "no musl gem this run"; exit 0; }
          GEM="${GEM#/work}"
          GEM="$RUNNER_TEMP$GEM"
          BASE="$(basename "$GEM")"
          VER="$(echo "$BASE" | sed -E 's/^yeptris-([0-9.]+)-.*/\1/')"
          PLAT="${BASE%.gem}"
          PLAT="${PLAT#yeptris-$VER-}"
          echo "pushing $VER / $PLAT"
          if curl -sf https://rubygems.org/api/v1/versions/yeptris.json | \
              ruby -rjson -e 'exit(JSON.parse(STDIN.read).any? { |v| v["number"]==ARGV[0] && v["platform"]==ARGV[1] } ? 0 : 1)' "$VER" "$PLAT"; then
            echo "already pushed; skipping"
          else
            gem push "$GEM"
          fi

  # The qemu-emulated platform gems (issue #376: the family's 14-gem
  # matrix — armv7 gnu+musl, ppc64le, s390x). The teptris-ruby recipe:
  # binfmt on ubuntu-latest, the arch ruby image per cell, the SAME
  # build-platform-gem.sh script the musl leg rides, smoke INSIDE the
  # container, then the already-pushed check. s390x is big-endian —
  # the engine's first BE binding surface; its smoke is load-bearing.
  platform-gems-qemu:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.republish_version != '')
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm-linux
            image: ruby:3.4-bookworm
            platform: linux/arm/v7
            packages: build-essential bash git cmake ninja
            setup: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential git cmake ninja-build
          - name: arm-linux-musl
            image: ruby:3.4-alpine
            platform: linux/arm/v7
            packages: build-base bash git cmake ninja
            setup: apk add --no-cache build-base bash git cmake ninja
          - name: ppc64le-linux
            image: ruby:3.4-bookworm
            platform: linux/ppc64le
            packages: build-essential bash git cmake ninja
            setup: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential git cmake ninja-build
          # ruby 3.3+ dropped the s390x variant from the official image
          - name: s390x-linux
            image: ruby:3.2-bookworm
            platform: linux/s390x
            packages: build-essential bash git cmake ninja
            setup: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential git cmake ninja-build
    steps:
      - name: Resolve the release version
        shell: bash
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          echo "YEP_V=$V" >> "$GITHUB_ENV"

      - name: Install binfmt emulators
        run: docker run --privileged --rm tonistiigi/binfmt --install arm,ppc64le,s390x

      - name: Build the ${{ matrix.name }} platform gem
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pgem-${{ matrix.name }}"
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$RUNNER_TEMP:/work" -w /work -e V="$YEP_V" \
            "${{ matrix.image }}" sh -c '
            set -eux
            ${{ matrix.setup }}
            git clone --quiet https://github.com/leptris/yeptris-ruby /work/rubyrepo
            bash /work/rubyrepo/scripts/build-platform-gem.sh "$V" https://github.com/leptris/yeptris-ruby "/work/pgem-${{ matrix.name }}"
          '

      - name: Smoke the ${{ matrix.name }} platform gem (in the container)
        shell: bash
        run: |
          GEM="$(find "$RUNNER_TEMP/pgem-${{ matrix.name }}" -name "yeptris-*.gem" | head -1)"
          test -n "$GEM" || { echo "no gem this run"; exit 1; }
          echo "gem: $GEM"
          GEM_CTR="/work${GEM#$RUNNER_TEMP}"
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$RUNNER_TEMP:/work" -w /work "${{ matrix.image }}" sh -c '
            set -eux
            gem install ffi --no-document
            gem install --local --no-document "'"$GEM_CTR"'"
            ruby -e "require %(yeptris); abort %(smoke) unless Yeptris::YAML.load(%(a: [1, 2])) == { %(a) => [1, 2] }; puts %(SMOKE PASS yeptris ${{ matrix.name }})"
          '

      - name: Configure RubyGems credentials (trusted publisher)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push the ${{ matrix.name }} platform gem
        shell: bash
        run: |
          GEM="$(cat "$RUNNER_TEMP/pgem-${{ matrix.name }}/gempath" 2>/dev/null | cut -d= -f2 || true)"
          test -n "$GEM" || { echo "no gem this run"; exit 1; }
          GEM="${GEM#/work}"
          GEM="$RUNNER_TEMP$GEM"
          BASE="$(basename "$GEM")"
          VER="$(echo "$BASE" | sed -E 's/^yeptris-([0-9.]+)-.*/\1/')"
          PLAT="${BASE%.gem}"
          PLAT="${PLAT#yeptris-$VER-}"
          echo "pushing $VER / $PLAT"
          if curl -sf https://rubygems.org/api/v1/versions/yeptris.json | \
              ruby -rjson -e 'exit(JSON.parse(STDIN.read).any? { |v| v["number"]==ARGV[0] && v["platform"]==ARGV[1] } ? 0 : 1)' "$VER" "$PLAT"; then
            echo "already pushed; skipping"
          else
            gem push "$GEM"
          fi

  # The macOS 26 (Tahoe) smoke — the OS that reported #125 (its
  # darwin-25 could not match the old suffixed platform and fell back
  # to the DLL-less pure-ruby gem). Coverage needs NO per-OS builds
  # (the versionless platform matches every macOS); this leg only
  # PROVES the pushed arm64-darwin gem on Tahoe itself.
  smoke-macos-26:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.republish_version != '')
    runs-on: macos-26
    needs: [publish, platform-gems]
    timeout-minutes: 10
    steps:
      - name: Resolve the release version
        shell: bash
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          echo "YEP_V=$V" >> "$GITHUB_ENV"

      - name: Install and smoke the pushed darwin gem (Tahoe)
        shell: bash
        run: |
          set -euxo pipefail
          # C-only cuts (next_version) have no ruby gem of that number —
          # the macOS-26 smoke rides the lockstep ruby release instead
          # (republish_version); the until-loop would spin to timeout
          if ! curl -fsSL -o /dev/null "https://rubygems.org/api/v1/versions/yeptris/${YEP_V}.json"; then
            echo "no ruby gem ${YEP_V} on rubygems (C-only cut) — skipping the macOS-26 smoke"
            exit 0
          fi
          until gem install --no-document "yeptris:${YEP_V}" >/dev/null 2>&1; do sleep 15; done
          ruby -e 'require "yeptris"; abort %(smoke) unless Yeptris::YAML.load(%(a: [1, 2])) == { %(a) => [1, 2] }; puts %(SMOKE PASS yeptris #{Yeptris::VERSION} on macOS 26)'

  # TODO.restructure/28's remainder: PLATFORM GEMS — the ruby gem +
  # vendored libyeptris + the compiled native materializer with a
  # RELATIVE rpath ($ORIGIN/@loader_path), so `gem install yeptris`
  # beats JSON.parse with zero compilation and zero env vars. The
  # recipe lives in the ruby repo's scripts/build-platform-gem.sh.
  platform-gems:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.republish_version != '')
    runs-on: ${{ matrix.os }}
    needs: publish
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          # macos-latest joined macos-15 on ARM (GitHub moved latest to
          # macOS 15 arm64): two legs built the SAME arm64-darwin gem
          # and raced on `gem push` — the loser failed the release with
          # "repushing not allowed". Keep the pinned leg only.
          - os: macos-15
          # Intel Macs (issue #316: "all platforms") — leptris-ruby's
          # leg shape; the darwin platform publishes VERSIONLESS.
          - os: macos-15-intel
          # Windows (the leptris-ruby legs): x64-mingw-ucrt on the
          # runner's default Ruby; aarch64-mingw-ucrt on the arm
          # runner (Ruby 3.3 has no arm64 build — the 3.3 cell degrades
          # to the loud FFI fallback for that minor only). x64-mingw32
          # is Ruby <= 3.0 (EOL) — intentionally not shipped.
          - os: windows-latest
          # Ruby <= 3.0 (x64-mingw32, the msvcrt ABI): the RubyInstaller
          # mingw toolchain builds the C lib with gcc — the build
          # script's mingw branch keys on this Ruby's platform
          - os: windows-latest
            ruby-version: '3.0'
          - os: windows-11-arm
            ruby-version: '3.4'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build >/dev/null

      - name: Install build tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Resolve the release version and lockstep tag
        shell: bash
        run: |
          V="${{ inputs.republish_version }}"
          if [ -z "$V" ]; then
            V="${{ github.event.pull_request.head.ref }}"
            V="${V#release/v}"
          fi
          echo "YEP_V=$V" >> "$GITHUB_ENV"
          echo "version: $V"

      - name: Build the C DLL and the per-minor native DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          cmake -B "$RUNNER_TEMP/yeptris-c/build" -S .             -DYEPTRIS_BUILD_TESTING=OFF -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build "$RUNNER_TEMP/yeptris-c/build" --config Release
          # CMake stages the DLL under bin/Release on Windows
          DLL="$RUNNER_TEMP/yeptris-c/build/bin/Release/yeptris.dll"
          test -f "$DLL" || DLL="$RUNNER_TEMP/yeptris-c/build/src/Release/yeptris.dll"
          test -f "$DLL" || DLL="$RUNNER_TEMP/yeptris-c/build/src/yeptris.dll"
          test -f "$DLL"
          cp "$DLL" "$RUNNER_TEMP/yeptris-c/build/src/libyeptris.dll"
          mkdir -p "$RUNNER_TEMP/pgem"
          # the binding checkout at the lockstep tag (empty when the
          # binding tag has not landed yet — the script skips cleanly)
          git clone --quiet https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/pgem/yeptris-ruby"
          cd "$RUNNER_TEMP/pgem/yeptris-ruby"
          LOCKSTEP="$(git tag -l "v${YEP_V}.*" | sort -V | tail -1 || true)"
          test -n "$LOCKSTEP" || { echo "no lockstep binding tag yet"; exit 0; }
          git checkout --quiet "$LOCKSTEP"
          # the per-minor build steps below carry these exports
          echo "YEPTRIS_LIB_PATH=$RUNNER_TEMP/yeptris-c/build/src/libyeptris.dll" >> "$GITHUB_ENV"
          echo "YEPTRIS_SRC=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
          echo "YEP_RUBYREPO=$RUNNER_TEMP/pgem/yeptris-ruby" >> "$GITHUB_ENV"

      - name: Per-minor native DLL 3.3 (Windows)
        if: runner.os == 'Windows' && (matrix.ruby-version || '3.3') != '3.3' && (matrix.ruby-version || '3.3') != '3.0'
        uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.3'
          bundler-cache: false
        continue-on-error: true
      - name: Build native DLL 3.3
        if: runner.os == 'Windows' && (matrix.ruby-version || '3.3') != '3.3' && (matrix.ruby-version || '3.3') != '3.0'
        shell: bash
        continue-on-error: true
        run: cd "$YEP_RUBYREPO" && ruby ext/build_windows_native.rb
      - name: Per-minor native DLL 3.4 (Windows)
        if: runner.os == 'Windows' && (matrix.ruby-version || '3.3') != '3.4' && (matrix.ruby-version || '3.3') != '3.0'
        uses: ruby/setup-ruby@master
        with:
          ruby-version: '3.4'
          bundler-cache: false
        continue-on-error: true
      - name: Build native DLL 3.4
        if: runner.os == 'Windows' && (matrix.ruby-version || '3.3') != '3.4' && (matrix.ruby-version || '3.3') != '3.0'
        shell: bash
        continue-on-error: true
        run: cd "$YEP_RUBYREPO" && ruby ext/build_windows_native.rb
      - name: Per-minor native DLL 4.0 (Windows)
        if: runner.os == 'Windows' && (matrix.ruby-version || '3.3') != '4.0' && (matrix.ruby-version || '3.3') != '3.0'
        uses: ruby/setup-ruby@master
        with:
          ruby-version: '4.0'
          bundler-cache: false
        continue-on-error: true
      - name: Build native DLL 4.0
        if: runner.os == 'Windows' && (matrix.ruby-version || '3.3') != '4.0' && (matrix.ruby-version || '3.3') != '3.0'
        shell: bash
        continue-on-error: true
        run: cd "$YEP_RUBYREPO" && ruby ext/build_windows_native.rb

      - name: Set up Ruby
        uses: ruby/setup-ruby@master # @master: the Windows RubyInstaller
          # toolchain (make + mingw) rides setup, the leptris-ruby legs
        with:
          ruby-version: "${{ matrix.ruby-version || '3.3' }}"

      - name: Build the platform gem
        shell: bash
        run: |
          # RubyGems 3.6 stamps a versionless darwin platform to the
          # LOCAL kernel at package time (metadata arm64-darwin-23);
          # 4.x packages it as declared. Update before the build or
          # Tahoe/macOS-13 users resolve the DLL-less pure-ruby gem.
          if [ "$RUNNER_OS" = "macOS" ]; then
            # the stamp only affects darwin platforms; Ruby 3.0's
            # RubyGems cannot install the newest rubygems-update
            gem update --system --no-document >/dev/null 2>&1 || gem update --system --no-document
          fi
          git clone --quiet https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/rubyrepo"
          # Windows: the pgem workdir already holds the binding
          # checkout with its staged per-minor DLLs — the script
          # reuses it (its own C clone rebuilds the DLL fresh)
          bash "$RUNNER_TEMP/rubyrepo/scripts/build-platform-gem.sh" "$YEP_V" https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/pgem"

      # TODO.restructure/40: prove the artifact BEFORE RubyGems — the
      # installed gem must load, activate its native bundle, and pass
      # the canary battery. A broken gem cannot reach the registry.
      # The battery comes from the TAG checkout (build-platform-gem.sh
      # leaves $RUNNER_TEMP/pgem/yeptris-ruby at the lockstep tag).
      - name: Smoke the platform gem
        shell: bash
        run: test -f "$RUNNER_TEMP/pgem/gempath" && scripts/smoke-gem.sh "$(cut -d= -f2 "$RUNNER_TEMP/pgem/gempath")" "$RUNNER_TEMP/pgem/yeptris-ruby" || echo "no platform gem this run (no lockstep tag yet)"

      - name: Configure RubyGems credentials (trusted publisher)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push the platform gem
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/pgem/gempath" || { echo "no platform gem this run"; exit 0; }
          GEM="$(cat "$RUNNER_TEMP/pgem/gempath" | cut -d= -f2)"
          VER="$(basename "$GEM" | sed -E 's/^yeptris-([0-9.]+)-.*/\1/')"
          # macOS: strip the kernel-version suffix so the check
          # matches the versionless platform the build script emits
          PLAT="$(ruby -e '
            p = Gem::Platform.local
            p.version = nil if p.os == "darwin"
            print p.to_s
          ')"
          # gem fetch exits 0 spuriously on the runners; the versions
          # API with an exact number+platform match is authoritative
          if curl -sf https://rubygems.org/api/v1/versions/yeptris.json | \
              ruby -rjson -e 'exit(JSON.parse(STDIN.read).any? { |v| v["number"]==ARGV[0] && v["platform"]==ARGV[1] } ? 0 : 1)' "$VER" "$PLAT"; then
            echo "already pushed; skipping"
          else
            gem push "$GEM"
          fi
