name: Release

# TODO.impl/20: releases are the automated workflow's job, never a
# manual tag. Phase 1 (workflow_dispatch with next_version) bumps the
# version (CMakeLists project VERSION is the SSOT; vcpkg.json +
# CHANGELOG sync) and opens the release PR. Phase 2 fires when that
# PR merges: tag + GitHub Release. The exact version number always
# comes from the dispatching human.

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: "Exact version to release (e.g. 0.2.0)"
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  id-token: write # RubyGems trusted publisher (OIDC)

jobs:
  cut:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version shape
        run: |
          echo "${{ inputs.next_version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not X.Y.Z"; exit 1; }

      - name: "Bump version (CMakeLists project VERSION is the SSOT)"
        run: |
          V="${{ inputs.next_version }}"
          sed -i "s/    VERSION [0-9]*\.[0-9]*\.[0-9]*/    VERSION $V/" CMakeLists.txt
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$V\"/" vcpkg.json
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$V\"/" ports/yeptris/vcpkg.json
          TODAY=$(date +%Y-%m-%d)
          if [ -f CHANGELOG.md ]; then
            sed -i "0,/^## \[Unreleased\]/s//## \[$V\] - $TODAY/" CHANGELOG.md
          fi

      - name: Create release PR
        run: |
          V="${{ inputs.next_version }}"
          git config user.name "release-workflow"
          git config user.email "release@yeptris.invalid"
          git checkout -b "release/v$V"
          git add CMakeLists.txt vcpkg.json ports/yeptris/vcpkg.json CHANGELOG.md 2>/dev/null || git add CMakeLists.txt vcpkg.json ports/yeptris/vcpkg.json
          git commit -m "release: v$V"
          git push origin "release/v$V"
          gh pr create --title "release: v$V" --body "Automated release branch for v$V. On merge, the workflow tags and publishes the GitHub Release." --base main
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tag and publish the GitHub Release
        run: |
          V="${{ github.event.pull_request.head.ref }}"
          V="${V#release/v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $V"; exit 1; }
          git config user.name "release-workflow"
          git config user.email "release@yeptris.invalid"
          git tag "v$V"
          git push origin "v$V"
          gh release create "v$V" --title "v$V" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # The lockstep gem: publish the yeptris-ruby tag matching this C
      # version ({c-full-semver}.{small-patch}) through the RubyGems
      # trusted publisher configured for THIS repo + workflow. No
      # matching tag (or the version already on RubyGems) -> skip.
      - name: Find the lockstep gem tag
        id: gemtag
        run: |
          V="${{ github.event.pull_request.head.ref }}"
          V="${V#release/v}"
          git clone --quiet https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/yeptris-ruby"
          cd "$RUNNER_TEMP/yeptris-ruby"
          BEST="$(git tag | grep -E "^v${V//./\.}\.[0-9]+$" | sort -V | tail -1 || true)"
          if [ -z "$BEST" ]; then
            echo "no lockstep gem tag v${V}.* — skipping gem publish"
            echo "found=" >> "$GITHUB_OUTPUT"
          else
            echo "lockstep gem: $BEST"
            echo "found=$BEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby
        if: steps.gemtag.outputs.found != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build the gem
        if: steps.gemtag.outputs.found != ''
        working-directory: ${{ runner.temp }}/yeptris-ruby
        run: |
          git checkout --quiet "${{ steps.gemtag.outputs.found }}"
          gem build yeptris.gemspec
          GEM_FILE="$(ls yeptris-*.gem | head -1)"
          echo "path=${RUNNER_TEMP}/yeptris-ruby/${GEM_FILE}" >> "$GITHUB_OUTPUT"
        id: gembuild

      - name: Push to RubyGems (trusted publisher)
        if: steps.gemtag.outputs.found != ''
        uses: rubygems/release-gem@v1
        with:
          gem: ${{ steps.gembuild.outputs.path }}
