name: Sanitizers (ASAN + TSAN)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: AddressSanitizer (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure (ASAN)
        run: |
          cmake -B build -S . -G Ninja \
            -DBUILD_TESTING=ON \
            -DYEPTRIS_BUILD_CLI=ON \
            -DYEPTRIS_ENABLE_ASAN=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Fetch conformance corpora
        run: scripts/fetch-corpora.sh

      - name: Test under ASAN
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1

  tsan:
    name: ThreadSanitizer (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure (TSAN)
        run: |
          cmake -B build -S . -G Ninja \
            -DBUILD_TESTING=ON \
            -DYEPTRIS_BUILD_CLI=ON \
            -DYEPTRIS_ENABLE_TSAN=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Fetch conformance corpora
        run: scripts/fetch-corpora.sh

      # the concurrency contract: one document per thread, read-only
      # document sharing safe — TSAN verifies the whole suite
      - name: Test under TSAN
        run: ctest --test-dir build --output-on-failure

  ubsan:
    name: UBSan (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure (UBSan)
        run: |
          cmake -B build -S . -G Ninja \
            -DBUILD_TESTING=ON \
            -DYEPTRIS_BUILD_CLI=ON \
            -DYEPTRIS_ENABLE_UBSAN=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Fetch conformance corpora
        run: scripts/fetch-corpora.sh

      # undefined behavior is a bug, not a report: -fno-sanitize-recover
      - name: Test under UBSan
        run: ctest --test-dir build --output-on-failure
