name: Publish gem

# Manual re-publish for a released version whose publish job failed
# (e.g. a transient asset-build bug): finds the lockstep yeptris-ruby
# tag for the given C version, builds and pushes the gem through the
# trusted publisher, and (re)attaches the native asset. No-op when
# the gem version already exists on RubyGems.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "C version to publish (X.Y.Z)"
        required: true

permissions:
  contents: write # release asset upload
  id-token: write # RubyGems trusted publisher (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build >/dev/null

      - name: Push the lockstep gem (if newer)
        id: gemtag
        run: |
          V="${{ inputs.version }}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version"; exit 1; }
          git clone --quiet https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/yeptris-ruby"
          cd "$RUNNER_TEMP/yeptris-ruby"
          BEST="$(git tag | grep -E "^v${V//./\.}\.[0-9]+$" | sort -V | tail -1 || true)"
          if [ -z "$BEST" ]; then
            echo "no lockstep gem tag v$V.* — nothing to publish"
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "lockstep gem: $BEST"
          gem_version="${BEST#v}"
          if gem fetch "yeptris" --version "$gem_version" >/dev/null 2>&1; then
            echo "yeptris $gem_version already on RubyGems"
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "push=true" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/yeptris-ruby" >> "$GITHUB_OUTPUT"
          echo "tag=$BEST" >> "$GITHUB_OUTPUT"
          echo "version=$gem_version" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        if: steps.gemtag.outputs.push == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build the gem
        if: steps.gemtag.outputs.push == 'true'
        working-directory: ${{ steps.gemtag.outputs.path }}
        run: |
          git checkout --quiet "${{ steps.gemtag.outputs.tag }}"
          gem build yeptris.gemspec
          echo "gem=$(ls yeptris-*.gem | head -1)" >> "$GITHUB_ENV"

      - name: Configure RubyGems credentials (trusted publisher)
        if: steps.gemtag.outputs.push == 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954e # v2.1.0

      - name: Push to RubyGems
        if: steps.gemtag.outputs.push == 'true'
        run: gem push "${{ steps.gemtag.outputs.path }}/${{ env.gem }}"

      - name: Build and attach the native asset
        run: |
          V="${{ inputs.version }}"
          scripts/build-native-asset.sh "$V" https://github.com/leptris/yeptris-ruby "$RUNNER_TEMP/native-asset"
          gh release upload "v$V" "$RUNNER_TEMP/native-asset"/yeptris-native-*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
