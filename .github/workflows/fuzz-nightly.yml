        #
        # r407 (run 45915521571, headSha verified = 92ba513a, the r406
        # merge, issue #1731): the r406 exclusion HELD — INITED clean
        # over the extended snapshot (#1470, corp 820, zero seed reds)
        # — and the round red by MUTATION (~43s in): 14 bytes
        # `{*L,&L,&MpMp:}`, ONE CopyPart off a walk-intermediate base
        # unit (corp 820 -> 2176; NOT a seed). The face is the
        # flow-anchor-colon family COMPOSED with agreeing alias/anchor
