        # WHOLESALE — 13 of 17 re-derive a comparator red within ONE
        # budget: the r226 breeder, the bom-anchored-key quartet
        # (r154/r156/r338 x2), bom-content-breaks-utf16be, BOTH catch
        # seed dirs (catch121-lone-utf8-bom, catch132-utf16-content-
        # bom), the leading-bom-content dir, double-content-bom,
        # catch116-block-key-bom and catch117-engine-bom (faces across
        # the documented-law neighborhoods: BOM+charset, BOM+block-
        # scalar, the comparator's own dump vocabulary pasted into a
        # plain, PS/UTF-16 compositions, the ` >#:` fold cell); only
        # bom-content-late-head-overflow,
        # bom-content-leading-break-utf16be, bom-utf16-line-start,
        # catch105-utf8-bom-reencode and catch113-push-lone-utf16-bom
        # stayed clean for one budget — and they are FAMILY-NAMED, so
        # they join the sweep with the pool (the r405 six-green-
        # controls precedent: riding is only clean until the walk
        # reaches them). The r1306 law cuts both ways,
        # so the EXCLUSION EXTENSION is the answer (the r375/r405
        # whole-family law), not an arm widening whose gate would
        # derive the mid-stream-BOM fold split from raw bytes (the
        # r370/r403 mutation-dense-gate law): `bom-*` sweeps the 9
        # never-excluded BOM-led seeds and `*bom*` sweeps the
        # straggler cohort the prefix form cannot reach (46/46 name
