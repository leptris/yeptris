name: Fuzz Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "total fuzz budget in minutes (split across harnesses)"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: true

jobs:
  fuzz:
    name: libFuzzer+ASan+UBSan (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang

      - name: Fetch corpora
        run: scripts/fetch-corpora.sh

      - name: Fetch libyaml (pinned 90a56d4, for the differential)
        run: |
          git clone --depth 1 https://github.com/yaml/libyaml deps/libyaml || true
          git -C deps/libyaml fetch --depth 1 origin 90a56d4500aa1a1798514c5cb55c3ad4cb095f94
          git -C deps/libyaml checkout 90a56d4500aa1a1798514c5cb55c3ad4cb095f94
          cmake -B deps/libyaml/build -S deps/libyaml \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DYAML_BUILD_SHARED_LIBS=OFF -DYAML_STATIC_LIB_NAME=yaml
          cmake --build deps/libyaml/build

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DYEPTRIS_ENABLE_FUZZING=ON \
            -DYEPTRIS_LIBYAML_ROOT=$GITHUB_WORKSPACE/deps/libyaml

      - name: Build
        run: cmake --build build

      - name: Seed corpus
        run: |
          mkdir -p corpus
          python3 scripts/gen-fuzz-corpus.py corpus
          cp test/port/libyaml/snapshots/*.in corpus/ 2>/dev/null || true
          cp test/fuzz/corpus/parse/* corpus/ 2>/dev/null || true
          find test/conformance/data/yaml-test-suite -name '*.yaml' -exec cp {} corpus/ \; 2>/dev/null || true
          find test/conformance/data/json-test-suite/test_parsing -name '*.json' -exec cp {} corpus/ \; 2>/dev/null || true

      # The comparator leg runs over its own snapshot of the seed corpus:
      # the parser legs above write their coverage-gaining mutations into
      # the shared corpus/ dir, and any of those mutations may be a
      # documented-divergence family member (the soup arms' neighborhood
      # is mutation-rich). Feeding fuzz_diff unvalidated parser-leg
      # output turned the nightly into a per-round arm-extension
      # treadmill (runs r251-r254: each red was a fresh mutation of our
      # own pinned seeds, crashing during the diff leg's seed read).
      # The soup seeds themselves are also excluded: the family is dense
      # (local mining harvested 30 members in 30 consecutive 20s runs —
      # #1306), so any seed-led fuzzing re-derives documented members
      # within seconds. The seeds stay under full ctest regression
      # (fuzz-diff-rNNN pins); the diff leg explores fresh space.
      - name: Comparator corpus snapshot
        # the r269 nested carrier joins the exclusion: same family
        # density (the arm pins it; the classifier declines nesting),
        # so the diff leg must not seed from it. The r271 block
        # PS/NEL fold carrier joins too: the walk's budgeted
        # alignment cannot reach the composition (the NEL site's
        # alignment bytes differ -- libyaml's break ate the indent
        # space), so neighbor mutations re-derive it; the arm pins
        # it EXACT-BYTES and the classifier declines block scalars
        # by declared scope. The utf16-midstream-bom family joins at
        # r298: three arm-model gaps (r243/r280/r298) harvested from
        # mutations of one pinned 14-byte seed -- a UTF-16BE seed is
        # one ChangeByte from a fresh documented-law composition, so
        # the diff leg explores fresh space; the seeds stay under the
        # full ctest (the fuzz-diff-r243/r280/r298 pins). The r351
        # empty-flow-key glued-hash seeds join the same way: the
        # classifier claims the composition (the r310 law's SEQ twin at
        # the split-explicit-key slot + the bare-collection comment
        # ride), the family is mutation-dense, and the pins carry the
        # bytes under the full ctest. The quoted-exotic-tab family
        # joins at r353: ten documented members (r331-r353), the
        # classifier claims the whole plain-key/paren composition
        # space, and the r353 red itself was one InsertByte from the
        # pinned r352 artifact seed -- the per-round arm-extension
        # treadmill this snapshot exists to stop; the pins carry the
        # bytes under the full ctest (the fuzz-diff-r331..r353 pins).
        # The root-anchor-quoted-follow family joins at r370 (the
        # snapshot's second gap, issue #1610): four documented
        # mutant-of-own-pin reds in five rounds (r356/r366/r368/r370),
        # each ONE ChangeByte/InsertByte from a pinned family seed,
        # now across the MEASURED head-charset row (the r370 widening
        # admits every printable non-break name byte outside
        # `,[]{}`/#/!/0x7F) -- the family is mutation-dense along its
        # whole row, so the diff leg must not seed from it; the pins
        # carry the bytes under the full ctest (the
        # fuzz-diff-r238..r370 pins).
        # The WHOLE utf16 seed family joins at r375 (the drill's own
        # bounded comparator soak): 45s of mutation from the remaining
        # utf16 seeds (utf16-nel-fold-*, utf16-ps-fold-bom) re-derived
        # a fresh midstream-BOM + NEL-fold composition (yeptris keeps
        # three mid BOMs as content through the fold lines, libyaml
        # keeps one) -- the r298 law generalizes: ANY UTF-16BE seed is
        # one ChangeByte from a fresh documented-law composition, so
        # the diff leg seeds from no utf16 seed at all; the pins carry
        # the bytes under the full ctest (the fuzz-diff-r159..r371
        # utf16/utf32 pins).
        # The r377 classifier families join (run 45317828972's carry):
        # the glued-`?{`/`?[` collection-key family (the r310/r351
        # neighborhood's glued variant), the doc-marker-lead pre-run
        # family (the r349 walk's run head), and the clean-eat SEQ
        # steal family (the r245/r319 neighborhood's clean cell) --
        # each is one ChangeByte from a fresh composition of the
        # documented laws, so the diff leg must not seed from them;
        # the pins carry the bytes under the full ctest (the
        # fuzz-diff-r377 pins).
        # The r379 alias-key family joins (the r378 drill soak, issue
        # #1636): the glued-`?*L` alias-key / bare-`?=` / glued-`?#`
        # composition -- the drill's own battery proved the neighborhood
        # is mutation-dense (one TAB->`2` ChangeByte re-derived a fresh
        # ate-adjacency shape, the m017 mutant), so the diff leg must
        # not seed from it; the pins carry the bytes under the full
        # ctest (the fuzz-diff-r379 pins).
        # The r361 tag-soup family joins (the r380 round, issue #1638):
        # the r379 drill's comparator soak harvested a fresh 175,981-byte
        # member of the family whose `?&` glued-anchor-key spelling
        # escapes the r362 classifier law (the question-member walk's key
        # slot declines `"`/`'`/`&`/`!` heads) -- and the diff leg still
        # seeds from the family's OWN pins (qflow-tag-soup-r361*.bin),
        # so its budget re-derives such siblings at the pins' own scale
        # (the r361 artifact differs from the sibling in ~96k of 148k
        # bytes after one budget of mutation -- mutation-dense, the
        # r1306 law), so the diff leg must not seed from it; the law
        # itself stays classifier-carried at modelled scale and the pins
        # carry the bytes under the full ctest (the fuzz-diff-r361/r362
        # pins).
        # The r381 colon-ride family joins (run 45485140275's carry,
        # issue #1643): the r381 round added the root-anchor-colon-ride
        # pins but missed this treadmill step, so the diff leg's
        # mutation walk seeded from them and re-derived a fresh member
        # of the body-adjacent root-anchor-quoted-follow vocabulary
        # (the same `U:ba:`-tail + `[[{""` chain law composition) --
        # mutation-dense, so the diff leg must not seed from it; the
        # pins carry the bytes under the full ctest (the
        # fuzz-diff-r381 pins).
        # The r386 glue-fold WAIVER family joins at r397 (run
        # 45736164715's round, issue #1694): the waiver-gluefold-* pins
        # (r386-r394) are the rider family's mutation sources -- the
        # r397 red itself was bytes away from the r393/r394 pins (the
        # value-slot rider `{?*2,&m:tag:...==ALI *VAL<CR>,s}`), and the
        # face adjudicated DECLINED-BY-DESIGN (fy errors "unexpected
        # alias" in BOTH passes on every probed row; the suite is
        # silent on the mid-plain `*`; the engines rest on opposite
        # resolutions of the ledgered r390 cut) -- so the diff leg must
        # not seed from the family at all, and the face's own
        # waiver-neg-alias-tail-ride* pins are live DIFFERs the gates
        # must never claim (the family-classify N-phase walks them).
        # The pins stay under the full ctest.
        # The r398 folded-header face joins the same day (run
        # 45748018830's round, issue #1697): the block-root
        # folded-header `>` x space-`#` comment-lead x raw PS/NEL
        # break-run x NEL-glued trailing `#` composition adjudicated
        # DECLINED-BY-DESIGN (fy strict-1.2 renders the scalar EMPTY
        # -- siding with libyaml -- on every probed row; fy --yaml-1.1
        # errors outright; the suite carries no raw NEL/PS row), so
        # its waiver-neg-foldheader-nel-comment* pins are live DIFFERs
        # the gates must never claim (the family-classify N-phase
        # walks them) and the diff leg must not seed from them. The
        # pins stay under the full ctest.
        # The r402 BOM-led charset composition joins (run
        # 45822172084's carry, issue #1711): the anchor-name-charset
        # family's stream-start BOM corner — the face is one
        # BOM-prepend from the no-BOM charset pins the diff leg
        # already cannot seed from, the family is mutation-dense
        # across the composed lead (the arm now claims the BOM-led
        # shapes, and mutations beyond the modeled set stay red by
        # design), so the diff leg must not seed from it; the pins
        # carry the bytes under the full ctest (the
        # fuzz-diff-r402 pins).
        # The WHOLE bom-line-start family joins at r403 (run
        # 45843890557's round, issue #1715): the double-line-start-BOM
        # face's FOURTH documented shape re-derived by MUTATION ~24s
        # into the diff leg's walk — the r392 trailing-blank pins rode
        # the comparator snapshot UNEXCLUDED, and their mutation walk
        # pasted the comparator's own `=VAL : ` dump vocabulary into
        # the plain, splitting it into a map the r364 one-plain
        # spelling, the r365 end-of-input-colon spelling, and the r226
        # removal twin all decline (the floor is 4 edits from the r392
        # pin: `t`->`L`, the `: ` insert, the trailing mark). THE
        # TREADMILL DECISION (measurement, issue #1715): each prior
        # arm patch on this family bought exactly one round
        # (r364 -> r365 -> r392 -> r403), the consensus basis stays
        # yeptris-siding (fy 04e0b58 renders the mark-content key and
        # the byte-exact mark-content value on the floor, the
        # artifact, and every probe face in BOTH its strict-1.2 and
        # --yaml-1.1 passes; the suite carries zero BOM rows at the
        # da267a5c pin), and the map-aware widening's gate surface
        # (deriving the plain-law split colon from raw bytes) is
        # itself mutation-dense — so the r370/r375/r380/r397 law
        # applies and the family JOINS THE EXCLUSION instead of
        # widening again: the diff leg must not seed from any
        # bom-line-start seed at all (the pins are the mutation
        # source; the r403 red is one paste-plus-insert from the r392
        # floor). The face itself stays red by design in the
        # comparator: its bytes pin as the r403 live-DIFFER negative
        # controls waiver-neg-bom-line-start-map-split-r403{,-artifact}
        # (the family-classify N-phase requires the waiver to decline
        # them forever), and the arms-claimed map-split pair pins
        # green under the full ctest (the fuzz-diff-r403 pins).
        # The NAMING-GAP stragglers join at r404 (run 45858435542's
        # round, issue #1718) — the FIRST re-derivation whose breeding
        # seeds are IDENTIFIED BY MEASUREMENT: the r387
        # root-anchor-quoted-follow vocabulary re-derived by MUTATION
        # (ShuffleBytes-EraseBytes-CrossOver, post-INITED) from
        # `qflow-depth-clamp-r368-artifact.bin` — the r368-era pin that
        # rides the snapshot under a name matching NO exclusion glob
        # (r370 excluded `root-anchor-quoted-follow-*`; the same face
        # family's r368 carry sat outside it), riding near-byte-identical
        # to the red: the same `&2?*: '` head, the same `[[{""` chain,
        # the same `U:ba:`-tail. THE DENSITY MEASUREMENT (one budget
        # each, fixed seed, the nightly bar): the r368 artifact seed
        # alone re-derives a face-matching red within 45s;
        # `qflow-gluefold-ps-r384.bin` and `waiver-neg-anchor-quoted-body.bin`
        # (a 1-byte hop out of its waiver's model) each re-derive OTHER
        # unclassified reds within 45s; the issue's remaining candidates
        # (`catch101-colon-quoted-follower.bin`,
        # `flow-q-quoted-follower.bin`, the non-artifact r368 clamp)
        # stayed CLEAN — the measured breeders join the exclusion, the
        # clean candidates ride. The face itself stays red by design:
        # its floor (greedy ddmin under the exact nightly bar) is the
        # 11-byte `&2: '<PS><NEL>'` quoted-fold cell — PS and NEL are
        # CONTENT on both engines singly (both fold a lone NEL to one
        # space; the p-nel1/p-ps1/p-nelps probes all agree), but the
        # ADJACENT `PS NEL` order splits the fold join (yeptris `PS
        # SP`, libyaml `PS LF` — its READ_LINE keeps LS/PS verbatim
        # while normalizing NEL to LF, and its fold branch joins the
        # verbatim leading break with the trailing LF); fy 1.0.0 keeps
        # BOTH raw in strict-1.2 (siding with NEITHER engine; the 1.2
        # c-printable reading) and the suite carries ZERO raw PS/NEL
        # rows across all 351 dirs — no declined-by-design basis, no
        # arm widening (the r370/r403 law: the gate surface is itself
        # mutation-dense); the floor + artifact bytes pin as the r404
        # live-DIFFER negative controls
        # waiver-neg-psnel-quoted-fold-r404{,-artifact} (the
        # family-classify N-phase requires the waiver to decline them
        # forever), and the agreed reverse-order NELPS pair pins green
        # under the full ctest (the fuzz-diff-r404 pins). The
        # psnel-quoted-fold pins stay out of the snapshot with the
        # breeders.
        # The WHOLE gluefold-qhash soup POOL joins at r405 (run
        # 45880924803's round, issue #1723) — the r404 soak's own
        # prediction landed: the diff leg passed INITED CLEAN (the
        # #1722 glob fix verified) and red by MUTATION 52s in on a
        # 113-byte `{?#?#|#|+`-led flow-soup face bred by ONE CopyPart
        # from `flow-qate-run-r380-artifact.bin` — an r380-era pin
        # riding the snapshot under a name matching NO exclusion glob.
        # THE DENSITY MEASUREMENT (the r404 census carried forward to
        # its pool; one 45s budget each, fixed seed 405, single-file
        # seed dirs, the nightly bar, over the WHOLE 74-seed
        # `?#`-vocabulary pool the census had measured, contended
        # 3-way on a loaded arm64 host): 64 of 74 seeds re-derive a red
        # within ONE budget (42 the face-matching gluefold soup, 22
        # neighboring documented-family faces — the utf16-BOM law, the
        # r390 alias-cut bucket, the `?*L` alias-soup cells); 10 stayed
        # clean for one budget. THE r1306 LAW CUTS BOTH WAYS and the
        # pool as a whole re-derives, so the EXCLUSION EXTENSION is the
        # answer (the r375/r397 whole-family law), not an arm widening
        # whose gate would derive the plain-vs-indicator `?#` split
        # from raw bytes (the r370/r403 mutation-dense-gate law). The
        # family globs sweep 104 seeds — the 71 measured pool members
        # PLUS 33 lineage siblings whose bytes lack the literal `?#`
        # cell (the alias-charset-glued/anchor-glued-hash/
        # qflow-seq-question/qflow-lsps/docsoup r116-r380 comparators)
        # — so the naming gap cannot regrow inside the extension
        # (THE R404 LESSON, applied forward). THE CELL LAW: the glued
        # `?#` cell inside a flow collection splits the plain-vs-
        # indicator resolution — yeptris keeps `?#...` as plain-scalar
        # CONTENT (1.2 ns-plain-first: `?` followed by non-space
        # continues a plain; `#` never starts a comment without
        # preceding whitespace), libyaml treats the `?` as the
        # complex-key indicator and the glued `#...` as a comment run
        # (the member collapses to an empty key/value and the run
        # swallows the separator tail); the `*L:` alias riders, the
        # `20:` colon-ride members and the `#|#` mid-token cells all
        # AGREE singly (p1-p9 probe matrix through the harness). THE
        # CONSENSUS BASIS: fy 04e0b58 accepts the single cells but
        # REJECTS the composed faces in BOTH strict-1.2 and
        # --yaml-1.1 passes (strict-1.2 "did not find expected node
        # content" at the `,?#` cell; the artifact "plain scalar cannot
        # start with a backtick") — siding with NEITHER engine; the
        # suite carries ZERO glued rows (`?#`, `,#`, `{#`, `[#` absent
        # from all 351 src dirs at the da267a5c pin) and the
        # alias-charset axis stays governed by 2SXE/W5VH/Y2GN.
        # DECLINED-BY-DESIGN per the r397/r398 precedent (no basis to
        # carry). THE PINS: the 15-byte greedy-ddmin floor
        # `{?,*L:<LF>,?#,-<LF>0}` (every single-byte deletion breaks
        # the bar) + the 113-byte artifact pin as the live-DIFFER
        # negative controls waiver-neg-gluefold-qhash-r405{,-artifact}
        # .bin, and the engines-agreed closed-map double-cell shape
        # `{?#,?#}` pins green under the full ctest (the
        # fuzz-diff-r405-gluefold-qhash unit; fy accepts it in both
        # passes). The SAME cell composes to three engine-relations by
        # tail: closed compositions agree, the open-tail floor-head
        # `{?,*L:<LF>,?#}` is YEPTRIS-ONLY-ACCEPT (libyaml errors, fy
        # sides with yeptris), and the full break-tail floor is the
        # live DIFFER. The gluefold-qhash names stay out of the snapshot
        # with the pool. Six of the seven early waiver-era GREEN
        # firewall controls measured as live breeders (alias-member,
        # backtick, bom, nested-seq, paste-member-split, squote —
        # "riding is their designed behavior" held only until the walk
        # reached them) join by their own names; the measured-clean
        # non-family riders stay in the snapshot (rootplain,
        # mid-token-hash-prop-line, block-nel-escless-fold-r294).
        # Firewall unchanged: the r405 gluefold-qhash row (VERIFIED this
        # run by the clean INITED walk — the #1487 corpus, zero seed
        # reds, the pool did not re-derive), the r404 psnel-quoted-fold
        # row, the r403 bom-line-start exclusion row, the r402 BOM-led
        # charset row, the r401 nelrun row, the r400 block-bsi-root row,
        # the r398 foldheader row, the r397 alias-tail-ride row, the
        # r396 anchor-PS row, the r395 empty-slot row, the r390
        # alias-cut bucket, the r394 prop-charset row keep their arms.
        # The WHOLE BOM-named family joins at r406 (run 45899290043's
        # round, issue #1726) — the r405 exclusion HELD (INITED CLEAN)
        # and the round red by MUTATION on 14 bytes `feff0085
        # feff0085 feff0085 0021` (BOM+NEL x3 + `!` under UTF-16BE),
        # ONE ChangeByte off base unit `bom-utf16-nel-line-start-r226
        # .bin` (`0061`->`0021`) — an r226-era BOM-led seed riding the
