        # CONSENSUS BASIS: yeptris-siding per the standing BOM-content
        # rows — fy 04e0b58 CANNOT READ UTF-16BE at all (Invalid UTF8
        # in BOTH passes on the floor and every u16be probe; siding
        # with NEITHER engine) and on the UTF-8 spelling of the same
        # composition keeps the BOMs RAW as content in BOTH passes
        # (siding WITH yeptris); the suite carries ZERO BOM/UTF-16/
        # raw-NEL rows across all 351 src dirs at the da267a5c pin.
        # THE DENSITY MEASUREMENT (the r404/r405 census form; one ~45s
        # budget each, fixed seed 406, single-file seed dirs, the
        # nightly bar, over the WHOLE 17-entry BOM-named riding set —
        # 14 file seeds + 3 seed dirs; seed-read cleanliness verified
